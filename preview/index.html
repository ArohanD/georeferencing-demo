<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>The Listening Machine — historical maps</title>
<link rel="stylesheet" href="leaflet.css">
<style>
*{box-sizing:border-box}body{margin:0;height:100vh;height:100dvh;display:flex;flex-direction:column;font:14px system-ui;color:#242424;background:#f8f5ee}
header{padding:10px 16px;display:flex;flex-wrap:wrap;gap:10px 18px;align-items:center;border-bottom:1px solid #ddd8cd;z-index:1000}
label{display:flex;align-items:center;gap:7px}button,select{font:inherit;max-width:100%;padding:5px 8px}button{cursor:pointer}input{margin:0}#opacity{width:110px}output{min-width:3ch;font-variant-numeric:tabular-nums}
main{position:relative;flex:1;min-height:240px}#map{height:100%;background:#e8e6e0}.status{position:absolute;top:10px;right:10px;z-index:1000;max-width:min(330px,75%);pointer-events:none}.status p{margin:0 0 6px;padding:8px 12px;background:#fffef9;box-shadow:0 1px 5px #0003;border-radius:3px}
footer{padding:6px 16px;font-size:11px;color:#554f43}a{color:#14598a}button:focus-visible,select:focus-visible,input:focus-visible{outline:2px solid #14598a;outline-offset:2px}
@media(max-width:520px){header{padding:8px 10px;gap:8px 12px}label:first-child{width:100%}#historical-layer{flex:1}footer{padding:6px 10px}}
</style>
</head>
<body>
<header aria-label="Map controls">
<label>Layer <select id="historical-layer"></select></label>
<label>Opacity <input id="opacity" type="range" min="0" max="100" value="55"><output id="percent" for="opacity">55%</output></label>
<button id="retry" type="button">Retry</button>
<button id="fit" type="button">Fit</button>
<label><input id="visible" type="checkbox" checked> Show</label>
<label>Basemap <select id="basemap"></select></label>
</header>
<main aria-label="Historical and modern map comparison">
<div id="map"></div>
<div class="status"><p id="layer-status" role="status" aria-live="polite" hidden></p><p id="base-status" role="status" aria-live="polite" hidden></p></div>
</main>
<footer>Approximate historical-map alignment. For visual comparison only; not suitable for locating routes or sites precisely.</footer>
<script src="leaflet.js"></script><script src="map-config.js"></script><script src="app.js"></script>
</body>
</html>
